# GTM public demand surfaces — source of truth for verify_gtm_public_surfaces.py
version: 1
api_base_production: https://api.dealix.me

api_trust_endpoints:
  - path: /healthz
    purpose_ar: "Railway healthcheck + uptime probes"
    auth: public
  - path: /health
    purpose_ar: "Liveness + version summary"
    auth: public
  - path: /version
    purpose_ar: "Deploy identity (version, git_sha, env)"
    auth: public
  - path: /api/v1/meta
    purpose_ar: "GTM public surface registry + canonical production links"
    auth: public

frontend_public_routes:
  - path: "/"
    file_hint: "apps/web/app/page.tsx"
    purpose_ar: "Commercial launch home (default locale)"
  - path: "/en"
    file_hint: "apps/web/app/en/page.tsx"
    purpose_ar: "English commercial launch home"
  - path: "/company"
    file_hint: "apps/web/app/company/page.tsx"
    purpose_ar: "Company overview"
  - path: "/services"
    file_hint: "apps/web/app/services/page.tsx"
    purpose_ar: "Service ladder overview"
  - path: "/sectors"
    file_hint: "apps/web/app/sectors/page.tsx"
    purpose_ar: "Sector catalog index"
  - path: "/products"
    file_hint: "apps/web/app/products/page.tsx"
    purpose_ar: "Product catalog"
  - path: "/dealix-os"
    file_hint: "apps/web/app/dealix-os/page.tsx"
    purpose_ar: "Dealix operating system showcase"
  - path: "/book"
    file_hint: "apps/web/app/book/page.tsx"
    purpose_ar: "Free diagnostic intake + booking"
  - path: "/saudi-opportunity-radar"
    file_hint: "apps/web/app/saudi-opportunity-radar/page.tsx"
    purpose_ar: "Saudi market opportunity radar"
  - path: "/safety"
    file_hint: "apps/web/app/safety/page.tsx"
    purpose_ar: "Trust, safety, compliance center"
  - path: "/cases"
    file_hint: "apps/web/app/cases/page.tsx"
    purpose_ar: "Case studies / proof stories"
  - path: "/pricing"
    file_hint: "apps/web/app/pricing/page.tsx"
    purpose_ar: "Pricing overview (no fixed public price)"
  - path: "/client-portal/demo"
    file_hint: "apps/web/app/client-portal/demo/page.tsx"
    purpose_ar: "Public client portal demo"

ops_admin_routes:
  note_ar: "تتطلب DEALIX_ADMIN_API_KEY — ليست قنوات توزيع عامة"
  paths:
    - "/ops/founder"
    - "/ops/war-room"
    - "/ops/marketing"
    - "/ops/sales"
    - "/ops/partners"
    - "/ops/evidence"
    - "/ops/approvals"
    - "/ops/command-room"
