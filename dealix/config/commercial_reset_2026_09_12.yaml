version: "2026-09-12"
status: ACTIVE_DRAFT_AUTHORITY_FOR_AGENT_PREPARATION
name: DEALIX_COMMERCIAL_RESET
market: Saudi Arabia
north_star: CASH_READY_AUTONOMOUS_DEALIX_COMPANY

positioning:
  company: "Dealix — Saudi AI Business Operating System"
  external_category: "AI Business Operating System"
  promise_en: "Diagnose the workflow. Deploy the right intelligence. Govern the action. Prove the outcome."
  promise_ar: "شخّص العملية، فعّل الذكاء المناسب، احكم التنفيذ، وأثبت النتيجة."
  mechanism: "Assess -> Decide -> Automate -> Govern -> Prove"
  rule: "Sell a measurable business outcome, not an agent count or isolated AI feature."

commercial_path:
  - MARKET_SIGNAL
  - EVIDENCE
  - REAL_INTERACTION
  - QUALIFIED_PROBLEM
  - FREE_DIAGNOSTIC
  - QUALIFIED_DISCOVERY
