# Partner program rules (reference).
models:
  referral_partner:
    fee_on_first_payment_percent_range: [10, 20]
    note: "Set in signed agreement; example range only."
  implementation_partner:
    implementation_fee: retained_by_partner
    diagnostic_proof_layer: retained_by_dealix
  co_selling_pilot:
    split_or_referral_fee: "per_agreement"
  white_label:
    minimum_paid_pilots_before: 3
    note: "Do not rush; legal + delivery review."

kpi_targets_reference:
  partner_calls_per_month: ">= as set in ops"
  partner_sourced_paid_diagnostics: ">= as set in ops"
  implementation_handoffs: ">= as set in ops"

principles:
  - start_flexible
  - keep_initial_terms_simple
  - first_goal_one_pilot_or_one_referral


# Partner Network V2 — canonical economics for new marketer/channel motions.
# Legacy models above remain compatibility surfaces, not V2 payout authority.
partner_network_v2:
  authority: dealix.commercial.partner_program_v2
  public_name: "Dealix Partner Network"
  protection_days: 120
  max_extension_days: 180
  clearing_days: 30
  saas_commission_months: 12
  service_rates:
    scout: 0.075
    growth_partner: 0.10
    co_sell_partner: 0.125
    closer_sector_partner: 0.15
    strategic_channel: 0.20
  saas_rates:
    scout: 0.20
    growth_partner: 0.25
    co_sell_partner: 0.25
    closer_sector_partner: 0.30
    strategic_channel: 0.30
  nccr_deductions:
    - vat_sar
    - refunds_sar
    - credits_sar
    - chargebacks_sar
    - pass_through_ad_spend_sar
    - third_party_licenses_at_cost_sar
    - pass_through_vendor_costs_sar
    - government_fees_sar
  attribution_split:
    source: 0.40
    qualification: 0.20
    close: 0.40
  payout_requires:
    - active_partner
    - registered_non_duplicate_opportunity
    - verified_collected_cash
    - positive_nccr
    - clearing_period_complete
    - approval_record
  hard_holds:
    - government_or_tender_without_compliance_review
    - government_official_or_employee
    - influence_based_compensation
    - cold_whatsapp
    - marketing_consent_not_proven
    - misleading_or_guaranteed_claim
  strategic_service_rate_requires_margin_approval: true
  qualification:
    partner_application_required: true
    minimum_checks:
      - identity_or_business_verification
      - audience_or_relationship_fit
      - sector_focus
      - compliance_acknowledgement
      - approved_claims_training
      - payment_and_tax_profile
  promotion:
    levels: [starter, pro, elite, strategic]
    based_on:
      - verified_collected_revenue
      - conversion_quality
      - retention_quality
      - customer_quality
      - compliance_record
    not_based_on_only: [raw_lead_count, clicks, impressions]
  expansion_and_renewal:
    expansion_rate_percent_range: [5, 12.5]
    expansion_requires_incremental_partner_causation: true
    renewal_rate_percent_range: [3, 5]
    renewal_requires_material_partner_contribution: true
    automatic_lifetime_entitlement: false
  anti_fraud:
    - self_referral_without_signed_exception
    - fake_or_duplicate_company
    - attribution_manipulation_or_cookie_stuffing
    - unconsented_purchased_list
    - fabricated_buyer_intent
    - falsified_payment_evidence
    - customer_partner_collusion
    - public_sector_conflict_or_influence_risk
  authority_rules:
    one_company_machine: true
    no_parallel_partner_crm: true
    customer_specific_pricing_only: true
    public_fixed_price_authority: false
    portal_payment_execution_authority: false
