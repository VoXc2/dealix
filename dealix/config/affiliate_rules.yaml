# Affiliate program rules (legacy compatibility + V2 compliance reference). Legal review required for public terms.
legacy_reference_only: true
tiers:
  - applicant
  - approved_affiliate
  - qualified_referral_partner
  - strategic_partner
  - implementation_partner

commission_reference_percent:
  paid_diagnostic_from_affiliate_lead: 5
  warm_intro_to_decision_maker_paid_deal: 10
  strategic_partner_deal_range: [15, 20]
  custom_implementation_or_revshare: "per_agreement"

no_commission_when:
  - traffic_only
  - unqualified_lead
  - duplicate_lead
  - no_explicit_consent
  - outside_icp
  - no_pain_or_budget
  - refund_within_clawback_window

payout:
  only_after_event: verified_cash_collected
  requires_approval: true

messaging:
  disclosure_required: true
  no_spam: true
  no_cold_whatsapp_brand_name: true
  no_misleading_claims: true
  no_roi_guarantee: true
  no_compliance_guarantee: true
  no_scraping: true
  no_mass_linkedin_automation: true
  no_unapproved_pricing: true
  no_binding_quote_authority: true


partner_network_v2_compliance:
  marketing_consent_required: true
  consent_evidence_required: true
  sender_identity_required: true
  opt_out_required: true
  cold_whatsapp_prohibited: true
  government_or_tender_requires_review: true
  government_official_or_employee_hold: true
  influence_based_compensation_prohibited: true
  pricing_authority: dealix_only
  binding_quote_authority: dealix_only
  public_claims_require_evidence: true
  payment_truth:
    quote_is_payment: false
    invoice_is_payment: false
    won_is_payment: false
    verified_collection_required: true
    portal_can_execute_bank_payment: false
