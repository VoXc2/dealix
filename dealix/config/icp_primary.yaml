# Primary ICP — Governed AI Execution Platform for Saudi Business
version: 2
positioning_ar: >
  نحول إشارات الشركة إلى قرارات وتنفيذ محكوم ونتائج قابلة للإثبات —
  بوضوح مصادر، حدود موافقة، مسارات أدلة، وقياس قيمة.
positioning_en: >
  Governed AI execution for Saudi business: turn company signals into decisions,
  controlled action, and measurable proof.

market_identity: governed_ai_execution_platform
mechanism: signal_decision_action_proof

# V3 names are market-facing labels only. Operational commercial authority stays
# on the accepted launch IDs until a separately accepted authority migration
# updates runtime, public catalog, delivery, proof, and source-map contracts.
market_entry_label: execution_diagnostic
market_paid_offer_label: outcome_sprint
market_expansion_label: dealix_runtime
entry_offer_id: free_mini_diagnostic
primary_offer_id: revenue_command_pilot_30d
pricing_authority: customer_specific_quote_only
public_fixed_price: false
public_checkout: false

segments:
  - id: saudi_midmarket_b2b_tech_services
    label_ar: شركات التقنية وخدمات B2B المتوسطة في السعودية
    pain_signals:
      - فرص ومتابعات موزعة بين أنظمة متعددة
      - قرار تشغيلي غير مربوط بالتنفيذ والإثبات
      - تجارب AI لا تتحول إلى workflow اقتصادي قابل للقياس
  - id: it_si_consulting_professional_services
    label_ar: تكامل الأنظمة والاستشارات والخدمات المهنية
    pain_signals:
      - handoff بين البيع والتسليم غير موثق
      - صعوبة إثبات القيمة للعميل
      - تعدد الأدوات بدون طبقة command موحدة
  - id: crm_erp_msp_ai_partner
    label_ar: شركاء ERP / CRM / MSP / AI
    pain_signals:
      - العملاء يحتاجون governed execution فوق أنظمة قائمة
      - الحاجة إلى Proof & Command layer بدل استبدال stack العميل
  - id: international_saudi_market_entry
    label_ar: شركات دولية تدخل السوق السعودي
    pain_signals:
      - إشارات سوق وشركاء متفرقة
      - صعوبة تحويل intelligence إلى next action محكوم
      - الحاجة إلى evidence-backed market access

disqualifiers:
  - student_or_job_seeker
  - vague_ai_curiosity_no_workflow
  - no_company_name
  - no_named_workflow_or_measurable_problem

routing_from_score:
  qualified_a_min: 15
  qualified_b_min: 10
  nurture_min: 6

materials:
  close_engine: docs/commercial/FULL_OPS_CLOSE_ENGINE_AR.md
  ops_client_pack: docs/commercial/ops_client_pack/
  demo_path: "/{locale}/business-now#strategy"
  diagnostic_landing: "/book"
  proof_pack_sample: "/proof-vault"
