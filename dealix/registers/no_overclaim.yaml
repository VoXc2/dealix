      - tests/test_service_catalog.py

  - id: first_launch_checkout_fail_closed
    claim: "Public pricing and checkout remain disabled. The founder has not yet approved a public first-launch price. The Revenue Command Pilot uses customer-specific duration and is quote-only after discovery, and the 1 SAR smoke plan is impossible in Production."
    status: Production
    last_reviewed: "2026-07-27"
    evidence:
      - api/routers/pricing.py
      - tests/test_pricing_plans_endpoint.py
      - tests/integration/test_full_customer_journey.py
      - docs/BILLING_MOYASAR_RUNBOOK.md
      - dealix/config/first_launch_offer_gate.yaml
      - tests/test_revenue_watch_offer_contract.py
    gaps:
      - "Five qualified design-partner conversations have not yet been documented under #864/#917"
      - "Moyasar sandbox, VAT, ZATCA e-invoice, refund, and reconciliation evidence remain required before enabling checkout"

  - id: transformation_os_catalog
    claim: "Ten enterprise transformation systems modeled as governed catalog offerings; prices are estimate ranges; no live send/charge; proposal + ROI generators are approval-gated and estimate-stamped"
    status: Partial
    evidence:
