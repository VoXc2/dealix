    baseline_metrics: [form_completion, delivery_time_hours]
    success_metrics: [diagnostic_delivered, qualified_conversation_started]
    proof_available: [internal_diagnostic_engine, delivery_runbook]
    proof_gaps: [no_customer_case_yet]
    claims_allowed: [delivery_in_24h_of_form_submission]
