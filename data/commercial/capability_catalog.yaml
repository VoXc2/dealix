# Dealix capability catalog — V17 Revenue Mesh (Repo Capability Miner output).
#
# Canonical capability records derived from executable repo/runtime evidence:
#   - service_catalog/registry.py          (17 canonical offerings; truth registry)
#   - data/commercial/product_catalog.yaml (offer ladder)
#   - data/commercial/pain_to_offer.yaml   (pain -> offer mapping)
#   - data/commercial/icp_segments.yaml    (ICP segments)
#   - first_launch_offer_gate.yaml         (launch motion authority)
#
# Rules:
#   - A capability is only listed here if it maps to executable evidence
#     (evidence_paths point to real modules/artifacts in this repository).
#   - No customer proof exists today. proof_available lists only internal /
#     system / methodology evidence. proof_gaps must be explicit.
#   - claims_blocked enforces the doctrine: no guaranteed revenue, no cold
#     WhatsApp, no LinkedIn automation, no scraping, no fake proof.
#   - capability_id values must match service_catalog registry ids so the
#     loader can cross-validate. product_catalog.yaml offer ids are used for
#     entry_offer / primary_paid_offer / expansion_offer where they exist;
#     registry ids are used otherwise (canonical registry wins for the 17).

