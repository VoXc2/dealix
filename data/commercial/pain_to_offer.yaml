# Pain → offer mapping. Connects each buyer pain category to the offer that
# resolves it, plus bundles, anti-patterns, and per-vertical pain priorities.
# Product configuration data (no customer PII).

# Every pain category has at least one mapped offer.
primary_mapping:
  - pain: lead_leakage
    offer: revenue_command_pilot_30d
    rationale_ar: تجربة محدودة لمدة 30 يوماً لقياس نقطة تسرب واحدة بعد الاكتشاف وعرض موثق.
  - pain: follow_up_chaos
    offer: revenue_os
    rationale_ar: متابعة منظّمة بدل العشوائية.
  - pain: crm_data_disorder
    offer: command_center
    rationale_ar: توحيد بيانات العملاء في مكان واحد.
  - pain: proposal_delay
    offer: delivery_os
    rationale_ar: تسريع توليد العروض والتسليم.
  - pain: weak_reporting
    offer: command_center
    rationale_ar: تقارير KPI أسبوعية واضحة.
  - pain: sales_team_inconsistency
    offer: revenue_os
    rationale_ar: قوالب وعمليات موحّدة للفريق.
  - pain: support_overload
    offer: delivery_os
    rationale_ar: فرز ومسوّدات ردود للدعم.
  - pain: no_proof_case_study_system
    offer: review_os
    rationale_ar: نظام أدلة وقصص نجاح موثّقة.
  - pain: slow_onboarding
    offer: delivery_os
    rationale_ar: استقبال عملاء أسرع وأوضح.
  - pain: weak_renewal_upsell
    offer: monthly_optimization_retainer
    rationale_ar: تجديد وتوسعة مبنية على القيمة المثبتة.
  - pain: uncertain_where_to_start
    offer: revenue_command_pilot_30d
    rationale_ar: التشخيص المجاني يكشف نقطة البداية ثم تجربة محكومة لمدة 30 يوماً تثبت الملاءمة.
  - pain: no_management_visibility
    offer: ai_command_center_os
    rationale_ar: رؤية تنفيذية موحّدة يومية عبر لوحة قيادة عربية وحوكمة موافقات.
  - pain: no_partner_channel
    offer: agency_partner_os
    rationale_ar: بناء قناة شركاء موثّقة بمتابعة عمولات وإثبات بموافقة العميل.
  - pain: weak_referral_system
    offer: agency_partner_os
    rationale_ar: نظام إحالات محكوم مع تتبع إيرادات الشركاء.
  - pain: weak_brand_positioning
    offer: brand_intelligence_os
    rationale_ar: نظام هوية ورسائل موحّد عربي/إنجليزي قابل لإعادة الاستخدام.
  - pain: inconsistent_messaging
    offer: brand_intelligence_os
    rationale_ar: بنك رسائل ونبرة صوت موحّدة لكل القنوات.
  - pain: manual_workflow_load
    offer: operations_automation_os
    rationale_ar: أتمتة عمليات متكررة مع بوابات موافقة بشرية وسجل تدقيق.
  - pain: ai_governance_risk
    offer: trust_governance_os
    rationale_ar: سياسات حوكمة وموافقات ذكاء اصطناعي ومسار تدقيق.
  - pain: compliance_uncertainty
    offer: trust_governance_os
    rationale_ar: تتبع موافقات وقوائم كبت وبنود إثبات ملزمة.
  - pain: no_growth_system
    offer: growth_engine_os
    rationale_ar: نموذج نمو محكوم مع مسودات فقط وبدون إرسال بارد.
  - pain: weak_partner_channel
    offer: agency_partner_os
    rationale_ar: تصميم قناة شركاء ومسودات تواصل خاضعة للموافقة.
  - pain: no_existing_solution_fit
    offer: custom_enterprise_system
    rationale_ar: نظام تشغيل مخصص حول عمليات الشركة يبدأ باكتشاف مدفوع.

# Bundles combine a primary offer with supporting sub-modules.
bundles:
  - name: growth_bundle
    primary_offer: revenue_os
    sub_modules:
      - proposal_factory
      - weekly_revenue_command
  - name: proposal_acceleration
    primary_offer: proposal_factory
    sub_modules:
      - proof_pack_factory
  - name: support_scale
    primary_offer: support_triage_draft_os
    sub_modules:
      - weekly_revenue_command

# Anti-patterns the system must refuse — each has a scenario, risk, and action.
anti_patterns:
  - scenario: Prospect asks for guaranteed revenue or ranking.
    risk: doctrine_violation
    action: Decline the guarantee; offer the free diagnostic and evidence-based estimates only.
  - scenario: Prospect wants cold WhatsApp or LinkedIn scraping automation.
    risk: forbidden_channel
    action: Refuse; explain the consent-first, no-scraping policy.
  - scenario: Prospect pushes for a discount below the margin floor.
    risk: margin_erosion
    action: Hold the floor; route to founder for an explicit decision.

# Per-vertical pain priority — ordered list per ICP segment. Keys must cover
# every segment id in icp_segments.yaml.
vertical_pain_priority:
  real_estate:
    - lead_leakage
    - follow_up_chaos
    - no_proof_case_study_system
  clinic:
    - follow_up_chaos
    - no_proof_case_study_system
    - weak_reporting
  logistics:
    - crm_data_disorder
    - weak_reporting
    - proposal_delay
  training:
    - slow_onboarding
    - follow_up_chaos
    - weak_renewal_upsell
  marketing_agency:
    - sales_team_inconsistency
    - proposal_delay
    - weak_reporting
  b2b_services:
    - lead_leakage
    - proposal_delay
    - weak_renewal_upsell
