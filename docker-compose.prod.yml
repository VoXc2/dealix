# HISTORICAL_REFERENCE_NON_AUTHORITATIVE
#
# This former production stack is intentionally non-runnable. Dealix has one
# canonical self-host deployment authority: deploy/selfhost/compose.yml.
# Keeping two runnable production Compose graphs caused release-identity,
# database-extension, service-name, and rollback drift.
#
# Safe source verification:
#   python scripts/ops/verify_selfhosted_production_plane.py
# Safe private canary:
#   DEALIX_EXPECTED_SHA=$(git rev-parse HEAD) bash scripts/ops/deploy_selfhosted_canary.sh
#
# Public ingress, production DB restore/cutover, DNS, secrets, and provider
# decommission remain exact action-bound L5 operations.
name: dealix-retired-production-entrypoint
x-dealix-authority:
  status: RETIRED_NON_AUTHORITATIVE
  canonical_compose: deploy/selfhost/compose.yml
  canonical_runbook: docs/ops/SELFHOSTED_PRODUCTION_PLANE.md
  external_effect: NONE
services: {}
