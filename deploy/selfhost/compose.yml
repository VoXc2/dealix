services:
  api:
    image: dealix-api:${DEALIX_IMAGE_TAG:?set exact DEALIX_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${DEALIX_GIT_SHA:?set exact DEALIX_GIT_SHA}
    environment:
      PORT: "8000"
      APP_ENV: ${DEALIX_APP_ENV:-development}
      ENVIRONMENT: ${DEALIX_APP_ENV:-development}
      GIT_SHA: ${DEALIX_GIT_SHA:?set exact DEALIX_GIT_SHA}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      API_KEYS: ${API_KEYS:-}
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-}
      APP_URL: http://127.0.0.1:${DEALIX_SELFHOST_API_PORT:-18000}
      BASE_URL: http://127.0.0.1:${DEALIX_SELFHOST_API_PORT:-18000}
      DEALIX_API_BASE: http://127.0.0.1:${DEALIX_SELFHOST_API_PORT:-18000}
      CORS_ORIGINS: http://127.0.0.1:${DEALIX_SELFHOST_WEB_PORT:-13000}
      DATABASE_URL: ${DEALIX_DATABASE_URL:-postgresql+asyncpg://dealix_canary@postgres:5432/dealix_canary}
      DEALIX_ORCHESTRATOR_BACKEND: ${DEALIX_ORCHESTRATOR_BACKEND:-postgres}
      DEALIX_ORCHESTRATOR_DATABASE_URL: ${DEALIX_DATABASE_URL:-postgresql+asyncpg://dealix_canary@postgres:5432/dealix_canary}
      EXTERNAL_SEND_ENABLED: "false"
      OUTBOUND_MODE: draft_only
      EMAIL_SEND_ENABLED: "false"
      WHATSAPP_SEND_ENABLED: "false"
      WHATSAPP_ALLOW_LIVE_SEND: "false"
      SMS_SEND_ENABLED: "false"
      PUBLIC_PUBLISH: "0"
      PAID_SPEND: "0"
      PAYMENT_EXECUTION: "0"
      PRODUCTION_MUTATION: "0"
      RUN_RAILWAY_PRE_DEPLOY_MIGRATE: "0"
    ports:
      - "127.0.0.1:${DEALIX_SELFHOST_API_PORT:-18000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [dealix]

  web:
    image: dealix-web:${DEALIX_IMAGE_TAG:?set exact DEALIX_IMAGE_TAG}
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${DEALIX_GIT_SHA:?set exact DEALIX_GIT_SHA}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      GIT_SHA: ${DEALIX_GIT_SHA:?set exact DEALIX_GIT_SHA}
    ports:
      - "127.0.0.1:${DEALIX_SELFHOST_WEB_PORT:-13000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [dealix]

  postgres:
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    profiles: ["local-db", "production-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealix_canary}
      POSTGRES_DB: ${POSTGRES_DB:-dealix_canary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DEALIX_SELFHOST_DB_PORT:-15432}:5432"
    volumes:
      - dealix-postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealix_canary} -d ${POSTGRES_DB:-dealix_canary}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dealix]

  ingress:
    image: caddy:2.11.4-alpine
    profiles: ["ingress-canary"]
    ports:
      - "127.0.0.1:${DEALIX_SELFHOST_INGRESS_PORT:-18081}:80"
    volumes:
      - ./Caddyfile.canary:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [dealix]

  public-ingress:
    image: caddy:2.11.4-alpine
    profiles: ["public-cutover"]
    ports:
      - "${DEALIX_PUBLIC_HTTP_BIND:-127.0.0.1:18080}:80"
      - "${DEALIX_PUBLIC_HTTPS_BIND:-127.0.0.1:18443}:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@dealix.me}
      DEALIX_DOMAIN: ${DEALIX_DOMAIN:-dealix.me}
      DEALIX_API_DOMAIN: ${DEALIX_API_DOMAIN:-api.dealix.me}
      DEALIX_FRONTEND_UPSTREAM: web:3000
    volumes:
      - ../../ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dealix-caddy-data:/data
      - dealix-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [dealix]

networks:
  dealix: {}

volumes:
  dealix-postgres-data: {}
  dealix-caddy-data: {}
  dealix-caddy-config: {}
