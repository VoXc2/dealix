name: Tenant Revision 020 PostgreSQL Proof
run-name: Tenant Revision 020 PostgreSQL Proof @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - db/migrations/versions/20260812_020_tenant_scope_conversations_tasks.py
      - db/migrations/versions/20260815_020_governed_orchestrator_state.py
      - scripts/ops/prove_revision_020_tenant_scope.py
      - .github/workflows/tenant-revision-020-postgres-proof.yml
  push:
    branches:
      - main
      - fix/p0-tenant-foundation-current-stack-20260815
    paths:
      - db/migrations/versions/20260812_020_tenant_scope_conversations_tasks.py
      - db/migrations/versions/20260815_020_governed_orchestrator_state.py
      - scripts/ops/prove_revision_020_tenant_scope.py
      - .github/workflows/tenant-revision-020-postgres-proof.yml
  workflow_dispatch:

concurrency:
  group: tenant-revision-020-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealix_test
          POSTGRES_PASSWORD: dealix_test
          POSTGRES_DB: dealix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealix_test -d dealix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PROOF_DATABASE_URL: postgresql+psycopg://dealix_test:dealix_test@127.0.0.1:5432/dealix_test
      DEALIX_REVISION_020_PROOF_EPHEMERAL: '1'

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install bounded proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'SQLAlchemy>=2.0,<3' 'alembic>=1.13,<2' 'psycopg[binary]>=3.2,<4'

      - name: Prove current migration graph has one head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config('alembic.ini'))
          heads = list(script.get_heads())
          expected = '20260812_020_tenant_scope_conversations_tasks'
          assert heads == [expected], f'unexpected Alembic heads: {heads!r}'
          tenant = script.get_revision(expected)
          assert tenant is not None
          assert tenant.down_revision == '20260815_020_governed_orchestrator_state', tenant.down_revision
          print('P0_1070_ALEMBIC_SINGLE_HEAD=PASS')
          PY

      - name: Prove explicit ephemeral guard
        shell: bash
        run: |
          set +e
          output="$(env -u DEALIX_REVISION_020_PROOF_EPHEMERAL \
            python scripts/ops/prove_revision_020_tenant_scope.py 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo 'revision proof unexpectedly ran without its ephemeral guard'
            exit 1
          fi
          grep -q 'refusing proof unless DEALIX_REVISION_020_PROOF_EPHEMERAL=1' <<<"$output"
          echo 'P0_1070_REVISION_020_GUARD=PASS'

      - name: Prove upgrade downgrade and tenant constraints on PostgreSQL 16
        run: python scripts/ops/prove_revision_020_tenant_scope.py
