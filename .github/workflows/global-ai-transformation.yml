name: Global AI Transformation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: global-ai-transformation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify global AI transformation
        run: bash scripts/verify_global_ai_transformation.sh
