name: Deploy to Railway

# Deploys the Dealix backend to Railway using exactly one credential mode.
# Project tokens use RAILWAY_TOKEN. Account/workspace tokens use
# RAILWAY_API_TOKEN. Values remain sealed in GitHub Actions secrets.
# Workflow-only changes do not auto-deploy; use workflow_dispatch after the
# separate production-deployment approval gate.

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "core/**"
      - "dealix/**"
      - "auto_client_acquisition/**"
      - "autonomous_growth/**"
      - "integrations/**"
      - "db/**"
      - "cli.py"
      - "Dockerfile"
      - "railway.json"
      - "railway.toml"
      - "Procfile"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      service:
        description: "Railway service name"
        required: false
        default: "dealix"
        type: string

concurrency:
  group: railway-backend-${{ inputs.service || vars.RAILWAY_SERVICE_NAME || 'dealix' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Railway credential mode
        id: check_token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_API_TOKEN" ]; then
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            echo "token_mode=conflict" >> "$GITHUB_OUTPUT"
            echo "::error::Configure exactly one Railway credential mode, not both."
            exit 1
          elif [ -n "$RAILWAY_TOKEN" ]; then
            echo "token_present=true" >> "$GITHUB_OUTPUT"
            echo "token_mode=project" >> "$GITHUB_OUTPUT"
          elif [ -n "$RAILWAY_API_TOKEN" ]; then
            echo "token_present=true" >> "$GITHUB_OUTPUT"
            echo "token_mode=account_or_workspace" >> "$GITHUB_OUTPUT"
          else
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            echo "token_mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither Railway credential is configured."
          fi

      - name: Install Railway CLI
        if: steps.check_token.outputs.token_present == 'true'
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://railway.com/install.sh) -y
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
          "$HOME/.railway/bin/railway" --version

      - name: Deploy to Railway
        id: railway_deploy
        if: steps.check_token.outputs.token_present == 'true'
        env:
          RAILWAY_TOKEN: ${{ steps.check_token.outputs.token_mode == 'project' && secrets.RAILWAY_TOKEN || '' }}
          RAILWAY_API_TOKEN: ${{ steps.check_token.outputs.token_mode == 'account_or_workspace' && secrets.RAILWAY_API_TOKEN || '' }}
          TOKEN_MODE: ${{ steps.check_token.outputs.token_mode }}
          INPUT_SERVICE: ${{ inputs.service }}
          CONFIG_SERVICE: ${{ vars.RAILWAY_SERVICE_NAME }}
          PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}
        run: |
          set -Eeuo pipefail
          mkdir -p reports/ci
          LOG="reports/ci/railway-deploy.log"
          SERVICE="${INPUT_SERVICE:-${CONFIG_SERVICE:-dealix}}"

          case "$TOKEN_MODE" in
            project)
              [ -n "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]
              ;;
            account_or_workspace)
              [ -z "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_API_TOKEN" ]
              ;;
            *)
              echo "::error::Unsupported Railway credential mode."
              exit 1
              ;;
          esac

          cmd=(railway up --service "$SERVICE" --detach --json)
          if [ -n "$PROJECT_ID" ]; then
            cmd+=(--project "$PROJECT_ID")
          fi
          if [ -n "$ENVIRONMENT_NAME" ]; then
            cmd+=(--environment "$ENVIRONMENT_NAME")
          fi

          {
            echo "commit=${GITHUB_SHA}"
            echo "token_mode=${TOKEN_MODE}"
            echo "service=${SERVICE}"
            echo "project_flag_configured=$([ -n "$PROJECT_ID" ] && echo true || echo false)"
            echo "environment_flag_configured=$([ -n "$ENVIRONMENT_NAME" ] && echo true || echo false)"
            echo "railway_version=$(railway --version 2>&1 | head -1)"
            echo "== pre-deploy status =="
            railway status --json || true
            if [ "$TOKEN_MODE" = "account_or_workspace" ]; then
              echo "== account/workspace identity =="
              railway whoami || true
            else
              echo "== identity check =="
              echo "Skipped account-level whoami for project-scoped authentication."
            fi
            echo "== railway up =="
          } 2>&1 | tee "$LOG"

          set +e
          "${cmd[@]}" > /tmp/railway-up.json 2> >(tee -a "$LOG" >&2)
          rc=$?
          set -e

          echo "railway_up_exit_code=$rc" | tee -a "$LOG"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Railway deploy failed; inspect railway-deploy-diagnostics."
            exit "$rc"
          fi

          deployment_id=$(
            python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/railway-up.json").read_text())
          deployment_id = payload.get("deploymentId")
          if not deployment_id:
              raise SystemExit("railway up did not return deploymentId")
          print(deployment_id)
          PY
          )
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Captured the deployment identity returned by railway up."

      - name: Upload Railway deploy diagnostics
        if: always() && steps.check_token.outputs.token_present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: railway-deploy-diagnostics
          path: reports/ci/railway-deploy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Wait for deployment to become active
        id: railway_wait
        if: steps.railway_deploy.outcome == 'success'
        env:
          RAILWAY_TOKEN: ${{ steps.check_token.outputs.token_mode == 'project' && secrets.RAILWAY_TOKEN || '' }}
          RAILWAY_API_TOKEN: ${{ steps.check_token.outputs.token_mode == 'account_or_workspace' && secrets.RAILWAY_API_TOKEN || '' }}
          TOKEN_MODE: ${{ steps.check_token.outputs.token_mode }}
          INPUT_SERVICE: ${{ inputs.service }}
          CONFIG_SERVICE: ${{ vars.RAILWAY_SERVICE_NAME }}
          PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}
          TARGET_DEPLOYMENT_ID: ${{ steps.railway_deploy.outputs.deployment_id }}
        run: |
          set -Eeuo pipefail
          SERVICE="${INPUT_SERVICE:-${CONFIG_SERVICE:-dealix}}"

          case "$TOKEN_MODE" in
            project)
              [ -n "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]
              ;;
            account_or_workspace)
              [ -z "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_API_TOKEN" ]
              ;;
            *)
              echo "::error::Unsupported Railway credential mode."
              exit 1
              ;;
          esac

          echo "Waiting for deployment $TARGET_DEPLOYMENT_ID for service '$SERVICE'..."
          for i in {1..80}; do
            cmd=(railway deployment list --service "$SERVICE" --limit 100 --json)
            if [ -n "$PROJECT_ID" ]; then
              cmd+=(--project "$PROJECT_ID")
            fi
            if [ -n "$ENVIRONMENT_NAME" ]; then
              cmd+=(--environment "$ENVIRONMENT_NAME")
            fi
            "${cmd[@]}" > /tmp/railway-deployments.json

            read -r deployment_id deployment_status < <(
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deployments = json.loads(Path("/tmp/railway-deployments.json").read_text())
          deployment = next(
              (item for item in deployments if item.get("id") == os.environ["TARGET_DEPLOYMENT_ID"]),
              None,
          )
          if deployment is None:
              print("MISSING MISSING")
          else:
              print(deployment.get("id", "MISSING"), deployment.get("status", "MISSING"))
          PY
            )

            if [ "$deployment_id" != "$TARGET_DEPLOYMENT_ID" ]; then
              echo "Attempt $i: Railway has not listed this deployment yet."
              sleep 15
              continue
            fi

            echo "Attempt $i: deployment status=$deployment_status"
            case "$deployment_status" in
              SUCCESS)
                echo "Railway reports the exact deployment as successful."
                echo "terminal_status=SUCCESS" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "terminal_status=$deployment_status" >> "$GITHUB_OUTPUT"
                echo "::error::Railway deployment reached terminal status: $deployment_status"
                exit 1
                ;;
              BUILDING|DEPLOYING|INITIALIZING|QUEUED|WAITING|SLEEPING)
                sleep 15
                ;;
              *)
                echo "::warning::Unexpected Railway deployment status: $deployment_status"
                sleep 15
                ;;
            esac
          done

          echo "terminal_status=TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "::error::Railway deployment did not become successful within 20 minutes."
          exit 1

      - name: Capture exact Railway terminal diagnostics
        if: failure() && steps.railway_deploy.outcome == 'success'
        env:
          RAILWAY_TOKEN: ${{ steps.check_token.outputs.token_mode == 'project' && secrets.RAILWAY_TOKEN || '' }}
          RAILWAY_API_TOKEN: ${{ steps.check_token.outputs.token_mode == 'account_or_workspace' && secrets.RAILWAY_API_TOKEN || '' }}
          TOKEN_MODE: ${{ steps.check_token.outputs.token_mode }}
          INPUT_SERVICE: ${{ inputs.service }}
          CONFIG_SERVICE: ${{ vars.RAILWAY_SERVICE_NAME }}
          PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}
          TARGET_DEPLOYMENT_ID: ${{ steps.railway_deploy.outputs.deployment_id }}
          TERMINAL_STATUS: ${{ steps.railway_wait.outputs.terminal_status }}
        run: |
          set -Eeuo pipefail
          mkdir -p reports/ci
          SERVICE="${INPUT_SERVICE:-${CONFIG_SERVICE:-dealix}}"
          LOG="reports/ci/railway-terminal.log"

          case "$TOKEN_MODE" in
            project)
              [ -n "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]
              ;;
            account_or_workspace)
              [ -z "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_API_TOKEN" ]
              ;;
            *)
              echo "::error::Unsupported Railway credential mode."
              exit 1
              ;;
          esac

          {
            echo "commit=${GITHUB_SHA}"
            echo "service=${SERVICE}"
            echo "deployment_id=${TARGET_DEPLOYMENT_ID}"
            echo "terminal_status=${TERMINAL_STATUS:-UNKNOWN}"
            echo "== exact deployment metadata =="
          } > "$LOG"

          if [ -s /tmp/railway-deployments.json ]; then
            TARGET_DEPLOYMENT_ID="$TARGET_DEPLOYMENT_ID" python3 - <<'PY' \
              > reports/ci/railway-terminal-deployment.json
          import json
          import os
          from pathlib import Path

          deployments = json.loads(Path("/tmp/railway-deployments.json").read_text())
          target = next(
              (item for item in deployments if item.get("id") == os.environ["TARGET_DEPLOYMENT_ID"]),
              {"id": os.environ["TARGET_DEPLOYMENT_ID"], "status": "MISSING"},
          )
          print(json.dumps(target, indent=2, sort_keys=True))
          PY
            cat reports/ci/railway-terminal-deployment.json >> "$LOG"
          else
            echo "deployment_list_snapshot=missing" >> "$LOG"
          fi

          variable_cmd=(railway variable list --service "$SERVICE" --json)
          if [ -n "$PROJECT_ID" ]; then
            variable_cmd+=(--project "$PROJECT_ID")
          fi
          if [ -n "$ENVIRONMENT_NAME" ]; then
            variable_cmd+=(--environment "$ENVIRONMENT_NAME")
          fi
          set +e
          "${variable_cmd[@]}" > /tmp/railway-vars.json 2> /tmp/railway-vars.err
          variable_rc=$?
          set -e

          if [ "$variable_rc" -eq 0 ]; then
            python3 - <<'PY' > reports/ci/railway-terminal-config-posture.json
          import json
          from pathlib import Path

          raw = json.loads(Path("/tmp/railway-vars.json").read_text())
          source = raw.get("variables", raw) if isinstance(raw, dict) else raw
          values: dict[str, str] = {}
          if isinstance(source, dict):
              for key, value in source.items():
                  if isinstance(value, dict):
                      value = value.get("value", "")
                  if value is not None:
                      values[str(key)] = str(value)
          elif isinstance(source, list):
              for item in source:
                  if not isinstance(item, dict):
                      continue
                  key = item.get("name") or item.get("key")
                  if not key:
                      continue
                  value = item.get("value", "")
                  values[str(key)] = "" if value is None else str(value)

          def value(name: str) -> str:
              return values.get(name, "").strip()

          app_env_raw = (value("APP_ENV") or value("ENVIRONMENT")).lower()
          app_env = app_env_raw if app_env_raw in {
              "production", "prod", "staging", "stage", "development", "dev", "test"
          } else ("configured_other" if app_env_raw else "unset")
          backend_raw = value("DEALIX_ORCHESTRATOR_BACKEND").lower()
          backend = backend_raw if backend_raw in {"postgres", "json", "memory"} else (
              "configured_other" if backend_raw else "unset"
          )
          app_secret = value("APP_SECRET_KEY")
          jwt_secret = value("JWT_SECRET_KEY")
          app_secret_valid = bool(app_secret) and app_secret not in {
              "change-me", "CHANGE_ME_to_64_byte_hex", "changeme"
          }
          jwt_secret_valid = (
              bool(jwt_secret) and "change-me" not in jwt_secret and len(jwt_secret) >= 32
          )

          posture = {
              "variable_inventory_readable": True,
              "run_railway_pre_deploy_migrate_enabled": value("RUN_RAILWAY_PRE_DEPLOY_MIGRATE") == "1",
              "database_url_configured": bool(value("DATABASE_URL")),
              "app_secret_key_configured": bool(app_secret),
              "app_secret_key_valid": app_secret_valid,
              "jwt_secret_key_configured": bool(jwt_secret),
              "jwt_secret_key_valid": jwt_secret_valid,
              "api_keys_configured": bool(value("API_KEYS")),
              "admin_api_keys_configured": bool(value("ADMIN_API_KEYS")),
              "orchestrator_backend": backend,
              "app_env": app_env,
              "fresh_db_bootstrap_enabled": value("DEALIX_ALLOW_FRESH_DB_BOOTSTRAP") == "1",
              "alembic_version_widen_enabled": value("DEALIX_ALLOW_ALEMBIC_VERSION_WIDEN") == "1",
          }
          print(json.dumps(posture, indent=2, sort_keys=True))
          PY
          else
            VARIABLE_RC="$variable_rc" python3 - <<'PY' \
              > reports/ci/railway-terminal-config-posture.json
          import json
          import os

          print(json.dumps({
              "variable_inventory_readable": False,
              "variable_list_exit_code": int(os.environ["VARIABLE_RC"]),
              "reason": "railway_variable_list_failed",
          }, indent=2, sort_keys=True))
          PY
          fi

          {
            echo
            echo "== sanitized configuration posture =="
            cat reports/ci/railway-terminal-config-posture.json
          } >> "$LOG"

          log_common=(--service "$SERVICE" --lines 250)
          if [ -n "$ENVIRONMENT_NAME" ]; then
            log_common+=(--environment "$ENVIRONMENT_NAME")
          fi
          {
            echo
            echo "== build logs for exact deployment =="
            railway logs "$TARGET_DEPLOYMENT_ID" "${log_common[@]}" --build || true
            echo
            echo "== deployment logs for exact deployment =="
            railway logs "$TARGET_DEPLOYMENT_ID" "${log_common[@]}" --deployment || true
            echo
            echo "== default logs for exact deployment =="
            railway logs "$TARGET_DEPLOYMENT_ID" "${log_common[@]}" || true
            echo
            echo "== error/warning logs for exact deployment =="
            railway logs "$TARGET_DEPLOYMENT_ID" "${log_common[@]}" --filter '@level:error OR @level:warn' || true
          } >> "$LOG" 2>&1

          rm -f /tmp/railway-vars.json /tmp/railway-vars.err
          echo "Captured exact failed-deployment diagnostics without exposing credentials or raw variables."

      - name: Upload Railway terminal diagnostics
        if: always() && steps.railway_deploy.outcome == 'success' && steps.railway_wait.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: railway-terminal-diagnostics
          path: |
            reports/ci/railway-terminal.log
            reports/ci/railway-terminal-deployment.json
            reports/ci/railway-terminal-config-posture.json
          if-no-files-found: warn
          retention-days: 7

      - name: Smoke test health and release identity
        id: healthz
        if: steps.railway_deploy.outcome == 'success' && steps.railway_wait.outcome == 'success'
        run: |
          set -euo pipefail
          URL="${{ vars.RAILWAY_PUBLIC_URL || 'https://api.dealix.me' }}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Smoke-testing exact deployment identity on $URL"

          for i in {1..12}; do
            hz=$(curl -sS --max-time 10 "$URL/healthz" || echo "")
            version_json=$(curl -sS --max-time 10 "$URL/version" || echo "")
            ver=$(
              VERSION_JSON="$version_json" python3 - <<'PY'
          import json
          import os

          try:
              payload = json.loads(os.environ["VERSION_JSON"])
              print("200" if payload.get("status") == "ok" else "000")
          except (json.JSONDecodeError, TypeError):
              print("000")
          PY
            )
            meta=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$URL/api/v1/meta" || echo "000")
            live_sha=$(
              VERSION_JSON="$version_json" python3 - <<'PY'
          import json
          import os

          try:
              print(json.loads(os.environ["VERSION_JSON"]).get("git_sha", ""))
          except (json.JSONDecodeError, TypeError):
              print("")
          PY
            )
            health_status=$(echo "$hz" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)
            echo "Attempt $i: healthz_status=$health_status git_sha=$live_sha version=$ver meta=$meta"
            if [ "$ver" = "200" ] \
              && [ "$meta" = "200" ] \
              && [ -n "$live_sha" ] \
              && [ "${GITHUB_SHA,,}" = "${live_sha,,}" ]; then
              echo "Trust layer proves the requested SHA: $live_sha"
              exit 0
            fi
            sleep 15
          done

          echo "::error::Trust layer did not expose the deployed SHA $GITHUB_SHA."
          exit 1

      - name: Post-deploy smoke pack
        if: steps.healthz.outcome == 'success'
        env:
          BASE_URL: ${{ steps.healthz.outputs.url }}
          DEALIX_API_KEY: ${{ secrets.DEALIX_API_KEY }}
        run: |
          set -euo pipefail
          echo "Checking that public pricing does not expose the retired 499 offer."
          pricing=$(curl -fsS --max-time 10 "$BASE_URL/api/v1/pricing/plans")
          PRICING_JSON="$pricing" python3 - <<'PY'
          import json
          import os

          json.loads(os.environ["PRICING_JSON"])
          PY
          if echo "$pricing" | grep -Eiq '(^|[^0-9])499(\.0)?([^0-9]|$)|Managed Pilot \(7 days\)'; then
            echo "::error::Production still exposes the retired 499 / 7-day offer."
            exit 1
          fi

          echo "Checking anonymous access rejection for the protected diagnostic."
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
            "$BASE_URL/api/v1/prospect/search-diag")
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "::error::Protected diagnostic returned $code anonymously."
            exit 1
          fi

          echo "Checking service-credential access for the protected diagnostic."
          if [ -z "$DEALIX_API_KEY" ]; then
            echo "::error::DEALIX_API_KEY is required for the positive protected smoke."
            exit 1
          fi
          curl -fsS --max-time 10 \
            -H "X-API-Key: $DEALIX_API_KEY" \
            "$BASE_URL/api/v1/prospect/search-diag" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('tier1=', d.get('tier1_ready'), 'tier2=', d.get('tier2_ready'))"

          echo "Checking anonymous session rejection."
          auth_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
            "$BASE_URL/api/v1/auth/me")
          if [ "$auth_code" != "401" ] && [ "$auth_code" != "403" ]; then
            echo "::error::Anonymous auth smoke returned $auth_code, expected 401/403."
            exit 1
          fi

          echo "Checking webhook rejection for a bad signature."
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST "$BASE_URL/api/v1/webhooks/moyasar" \
            -H "Content-Type: application/json" \
            -H "X-Moyasar-Signature: bogus" \
            -d '{"event":"payment_paid","data":{}}')
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "::error::Moyasar webhook accepted bad signature (got $code, expected 401/403)."
            exit 1
          fi

          echo "Post-deploy smoke pack passed."
