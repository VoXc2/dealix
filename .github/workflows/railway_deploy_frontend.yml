name: Deploy Frontend to Railway

# Deploys Dealix Next.js frontend when RAILWAY_TOKEN is configured.
# Setup: gh secret set RAILWAY_TOKEN --repo Dealix-sa/dealix
# Optional: gh variable set RAILWAY_FRONTEND_SERVICE --repo Dealix-sa/dealix (default: web)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/railway_deploy_frontend.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Railway frontend service name"
        required: false
        default: "web"
        type: string

permissions:
  contents: read

# Serialize deployments per frontend service so concurrent runs cannot
# accept one another's deployment evidence.
concurrency:
  group: railway-frontend-${{ inputs.service || vars.RAILWAY_FRONTEND_SERVICE || 'web' }}
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for RAILWAY_TOKEN
        id: check_token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN not configured - skip frontend deploy"
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "token_present=true" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        if: steps.check_token.outputs.token_present == 'true'
        run: |
          npm install -g @railway/cli
          railway --version

      - name: Deploy frontend
        id: railway_deploy
        if: steps.check_token.outputs.token_present == 'true'
        working-directory: apps/web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          INPUT_SERVICE: ${{ inputs.service }}
          CONFIG_SERVICE: ${{ vars.RAILWAY_FRONTEND_SERVICE }}
        run: |
          set -euo pipefail
          SERVICE="${INPUT_SERVICE:-${CONFIG_SERVICE:-web}}"
          [[ "$SERVICE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid Railway service name"; exit 2; }
          echo "Deploying frontend service: $SERVICE"
          railway up --service "$SERVICE" --detach --json > /tmp/railway-frontend-up.json
          deployment_id=$(
            python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/railway-frontend-up.json").read_text())
          deployment_id = payload.get("deploymentId")
          if not deployment_id:
              raise SystemExit("railway up did not return deploymentId")
          print(deployment_id)
          PY
          )
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Captured the frontend deployment identity returned by railway up."

      - name: Wait for frontend deployment
        if: steps.railway_deploy.outcome == 'success'
        working-directory: apps/web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          INPUT_SERVICE: ${{ inputs.service }}
          CONFIG_SERVICE: ${{ vars.RAILWAY_FRONTEND_SERVICE }}
          TARGET_DEPLOYMENT_ID: ${{ steps.railway_deploy.outputs.deployment_id }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SERVICE="${INPUT_SERVICE:-${CONFIG_SERVICE:-web}}"

          for i in {1..80}; do
            railway deployment list --service "$SERVICE" --limit 100 --json \
              > /tmp/railway-frontend-deployments.json
            read -r deployment_id deployment_status deployment_sha < <(
              python3 - <<'PY'
          import json
          from pathlib import Path

          deployments = json.loads(
              Path("/tmp/railway-frontend-deployments.json").read_text()
          )
          deployment = next(
              (
                  item
                  for item in deployments
                  if item.get("id") == __import__("os").environ["TARGET_DEPLOYMENT_ID"]
              ),
              None,
          )
          if deployment is None:
              print("MISSING MISSING MISSING")
          else:
              metadata = deployment.get("meta") or {}
              commit_sha = next(
                  (
                      str(metadata[key]).strip().lower()
                      for key in ("commitHash", "commitSha", "sourceCommitHash")
                      if metadata.get(key)
                  ),
                  "MISSING",
              )
              print(
                  deployment.get("id", "MISSING"),
                  deployment.get("status", "MISSING"),
                  commit_sha,
              )
          PY
            )
            if [ "$deployment_id" != "$TARGET_DEPLOYMENT_ID" ]; then
              echo "Attempt $i: Railway has not listed this run's frontend deployment yet."
              sleep 15
              continue
            fi
            if [ "$deployment_sha" != "${EXPECTED_GIT_SHA,,}" ]; then
              echo "Attempt $i: latest frontend deployment is not the requested commit."
              sleep 15
              continue
            fi
            echo "Attempt $i: requested frontend deployment status=$deployment_status"

            case "$deployment_status" in
              SUCCESS)
                echo "✅ Railway reports the frontend deployment as successful."
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "::error::Frontend deployment reached terminal status: $deployment_status"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          echo "::error::Frontend deployment did not become successful within 20 minutes."
          exit 1

      - name: Smoke /healthz and /ar on dealix.me
        if: steps.railway_deploy.outcome == 'success'
        env:
          CONFIG_FRONTEND_BASE: ${{ vars.DEALIX_FRONTEND_BASE }}
        run: |
          set -euo pipefail
          FE="${CONFIG_FRONTEND_BASE:-https://dealix.me}"
          case "$FE" in https://*) ;; *) echo "::error::frontend base must use https"; exit 2 ;; esac
          for i in {1..8}; do
            health_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$FE/healthz" || echo "000")
            ar_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$FE/ar" || echo "000")
            echo "Attempt $i: $FE/healthz -> $health_code; $FE/ar -> $ar_code"
            if [ "$health_code" = "200" ] && [ "$ar_code" = "200" ]; then
              echo "frontend health and Arabic home are live"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Frontend smoke failed; do not treat the deployment as live."
          exit 1
