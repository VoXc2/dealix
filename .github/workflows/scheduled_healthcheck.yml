name: Scheduled Health Check

# Manual, read-only fallback health diagnostic.
# Continuous production polling belongs to the canonical Dealix control plane,
# not GitHub-hosted Actions. Never create synthetic leads from a health check.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Production Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check /healthz
        id: healthz
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://api.dealix.me"
          code=$(curl -sS -o /tmp/healthz-body -w "%{http_code}" --max-time 15 "$URL/healthz")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "HEALTHZ=PASS status=$code"
          else
            echo "HEALTHZ=FAIL status=$code"
            cat /tmp/healthz-body || true
            exit 1
          fi

      - name: Check /api/v1/pricing/plans
        id: pricing
        if: success() || failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://api.dealix.me"
          code=$(curl -sS -o /tmp/pricing-body -w "%{http_code}" --max-time 15 "$URL/api/v1/pricing/plans")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "PRICING_PLANS=PASS status=$code"
          else
            echo "PRICING_PLANS=FAIL status=$code"
            cat /tmp/pricing-body || true
            exit 1
          fi
