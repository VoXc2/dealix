# Track D5 — legacy static landing Playwright smoke.
#
# This workflow intentionally serves `landing/` only. The Next.js interactive
# front door under `apps/web` has a separate browser-smoke workflow so the two
# render authorities cannot be accidentally tested against the wrong server.
# PR + manual only: continuous production monitoring belongs to the VPS plane.

name: Playwright Tier-1 smoke

on:
  pull_request:
    paths:
      - "landing/**"
      - "tests/playwright/tier1_smoke.spec.js"
      - "tests/playwright/market_to_delivery.spec.js"
      - "tests/playwright/playwright.config.js"
      - "tests/playwright/package.json"
      - ".github/workflows/playwright_smoke.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: playwright-landing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tests/playwright
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Playwright + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Serve landing/ statically
        working-directory: ${{ github.workspace }}/landing
        run: |
          python3 -m http.server 8765 &
          echo "PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run legacy landing Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8765
          CI: "true"
        run: |
          npx playwright test \
            tier1_smoke.spec.js \
            market_to_delivery.spec.js \
            --config playwright.config.js

      - name: Stop server
        if: always()
        run: kill ${PID:-0} || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-landing-report
          path: tests/playwright/playwright-report/
          retention-days: 14
