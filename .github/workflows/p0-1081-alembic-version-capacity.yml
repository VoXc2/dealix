name: P0 1081 Alembic Version Capacity
run-name: P0 1081 Alembic Version Capacity @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - scripts/ops/check_alembic_version_capacity.py
      - scripts/ops/widen_alembic_version_capacity.py
      - scripts/railway_predeploy.sh
      - tests/test_alembic_version_capacity_contract.py
      - .github/workflows/p0-1081-alembic-version-capacity.yml
  push:
    branches:
      - fix/p0-alembic-capacity-current-main-20260819
    paths:
      - scripts/ops/check_alembic_version_capacity.py
      - scripts/ops/widen_alembic_version_capacity.py
      - scripts/railway_predeploy.sh
      - tests/test_alembic_version_capacity_contract.py
      - .github/workflows/p0-1081-alembic-version-capacity.yml
  workflow_dispatch:

concurrency:
  group: p0-1081-alembic-version-capacity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  existing-db-capacity-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealix
          POSTGRES_PASSWORD: dealix
          POSTGRES_DB: dealix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dealix -d dealix"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://dealix:dealix@127.0.0.1:5432/dealix

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-timeout

      - name: Run safety contracts
        run: python -m pytest -q tests/test_alembic_version_capacity_contract.py

      - name: Create legacy Alembic version table
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine("postgresql+asyncpg://dealix:dealix@127.0.0.1:5432/dealix")
              try:
                  async with engine.begin() as conn:
                      await conn.execute(text("CREATE TABLE alembic_version (version_num VARCHAR(32) PRIMARY KEY)"))
                      await conn.execute(text("INSERT INTO alembic_version(version_num) VALUES ('0001')"))
              finally:
                  await engine.dispose()

          asyncio.run(main())
          PY

      - name: Prove narrow table fails closed before migration
        run: |
          set +e
          python scripts/ops/check_alembic_version_capacity.py > /tmp/preflight-before.log 2>&1
          rc=$?
          set -e
          cat /tmp/preflight-before.log
          test "$rc" -ne 0
          grep -q 'ALEMBIC_VERSION_CAPACITY=FAIL' /tmp/preflight-before.log

      - name: Prove widening requires explicit guards
        run: |
          set +e
          python scripts/ops/widen_alembic_version_capacity.py --confirm-existing-db-ddl > /tmp/no-env.log 2>&1
          rc_env=$?
          DEALIX_ALLOW_ALEMBIC_VERSION_WIDEN=1 python scripts/ops/widen_alembic_version_capacity.py > /tmp/no-flag.log 2>&1
          rc_flag=$?
          set -e
          cat /tmp/no-env.log
          cat /tmp/no-flag.log
          test "$rc_env" -ne 0
          test "$rc_flag" -ne 0

      - name: Widen ephemeral PostgreSQL version table
        env:
          DEALIX_ALLOW_ALEMBIC_VERSION_WIDEN: '1'
        run: |
          python scripts/ops/widen_alembic_version_capacity.py --confirm-existing-db-ddl

      - name: Prove capacity passes after widening
        run: |
          python scripts/ops/check_alembic_version_capacity.py | tee /tmp/preflight-after.log
          grep -q 'ALEMBIC_VERSION_CAPACITY=PASS' /tmp/preflight-after.log

      - name: Prove widening is idempotent
        env:
          DEALIX_ALLOW_ALEMBIC_VERSION_WIDEN: '1'
        run: |
          python scripts/ops/widen_alembic_version_capacity.py --confirm-existing-db-ddl | tee /tmp/widen-again.log
          grep -q 'changed=false' /tmp/widen-again.log
