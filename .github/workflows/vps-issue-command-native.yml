name: Dealix VPS Founder Issue Command Native

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

concurrency:
  group: dealix-vps-founder-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  founder-command:
    if: >-
      github.repository == 'Dealix-sa/dealix' &&
      github.event.repository.private == true &&
      github.event.issue.number == 1119 &&
      github.event.comment.user.login == 'VoXc2' &&
      startsWith(github.event.comment.body, '!dealix ')
    runs-on: [self-hosted, linux, x64, dealix-vps]
    timeout-minutes: 60
    steps:
      - name: Checkout default branch authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Execute through canonical fail-closed bridge
        env:
          GH_TOKEN: ${{ github.token }}
          DEALIX_NATIVE_EVENT_GRACE_SECONDS: '75'
        run: python3 scripts/ops/dealix_vps_issue_bridge.py --event
