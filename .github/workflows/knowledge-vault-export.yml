name: Knowledge Vault Export

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"
  pull_request:
    paths:
      - "dealix/knowledge_vault/**"
      - "scripts/knowledge/export_dealix_knowledge_vault.py"
      - "tests/test_knowledge_vault_exporter.py"
      - "docs/knowledge/OBSIDIAN_KNOWLEDGE_VAULT_BRIDGE_AR.md"
      - ".github/workflows/knowledge-vault-export.yml"

permissions:
  contents: read

concurrency:
  group: knowledge-vault-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Run focused safety tests
        run: >-
          python -m pytest tests/test_knowledge_vault_exporter.py
          -q --no-cov --noconftest

      - name: Export public repository sources only
        run: |
          python scripts/knowledge/export_dealix_knowledge_vault.py \
            --output artifacts/dealix-knowledge-vault \
            --clean

      - name: Verify proof and data-minimization contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/dealix-knowledge-vault")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          proof = json.loads((root / "proof-log.json").read_text(encoding="utf-8"))
          assert manifest["counts"]["repository_sources"] > 0
          assert manifest["counts"]["knowledge_entries"] == 0
          assert manifest["knowledge_json"] is None
          assert manifest["knowledge_json_opt_in"] is False
          assert proof["knowledge_json_opt_in"] is False
          assert proof["network_calls"] == 0
          assert proof["external_actions"] == 0
          assert (root / ".dealix-knowledge-vault.json").exists()
          assert (root / ".obsidian" / "app.json").exists()
          assert (root / ".obsidian" / "graph.json").exists()
          assert (root / "HOME.md").exists()
          assert (root / "CLAUDE.md").exists()
          for item in proof["files"]:
              path = root / item["path"]
              assert path.is_file(), item["path"]
              assert path.stat().st_size == item["bytes"], item["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"], item["path"]
          print(json.dumps(manifest["counts"], indent=2))
          PY

      - name: Upload repository-only vault artifact
        uses: actions/upload-artifact@v7
        with:
          name: dealix-knowledge-vault
          path: artifacts/dealix-knowledge-vault
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
