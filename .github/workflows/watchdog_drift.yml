# Track C3 — Watchdog drift diagnostic.
#
# Canonical continuous monitoring belongs on the Dealix VPS control plane.
# Keep this GitHub workflow as an explicit manual diagnostic so hosted Actions
# minutes are not consumed by hourly polling.

name: Watchdog drift

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: |
          pip install pytest httpx fastapi pydantic pydantic-settings python-jose passlib python-multipart email-validator pyyaml tenacity loguru orjson

      - name: Run watchdog
        env:
          WATCHDOG_BASE_URL: https://api.dealix.me
          WATCHDOG_SLACK_URL: ${{ secrets.WATCHDOG_SLACK_URL }}
        run: |
          python3 scripts/watchdog_drift_check.py --json | tee watchdog-report.json
          python3 scripts/watchdog_drift_check.py || echo "Drift detected — see Slack."

      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watchdog-report-${{ github.run_id }}
          path: watchdog-report.json
          retention-days: 7
