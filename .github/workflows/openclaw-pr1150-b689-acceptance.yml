name: OpenClaw PR1150 b689 Live Acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openclaw-pr1150-b689-acceptance.yml"

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  accept:
    runs-on: [self-hosted, linux, x64, dealix-vps]
    timeout-minutes: 35
    env:
      REPO: "Dealix-sa/dealix"
      TARGET_PR: "1150"
      EXPECTED_HEAD: "b689d1cfc23fe060677818173d48da0c7edf0c97"
      PROOF_ISSUE: "1119"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact head and run bounded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL="$(gh pr view "$TARGET_PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          [[ "$ACTUAL" == "$EXPECTED_HEAD" ]] || { echo "BLOCKED_HEAD_MOVED expected=$EXPECTED_HEAD actual=$ACTUAL"; exit 40; }

          SCRIPT="/tmp/pr1150-${GITHUB_RUN_ID}.sh"
          RAW="/tmp/pr1150-${GITHUB_RUN_ID}.raw"
          SAFE="/tmp/pr1150-${GITHUB_RUN_ID}.log"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${REPO}/contents/scripts/ops/repair_dealix_openclaw_gateway.sh?ref=${EXPECTED_HEAD}" > "$SCRIPT"
          test -s "$SCRIPT"
          chmod 700 "$SCRIPT"
          bash -n "$SCRIPT"

          set +e
          if [[ "$(id -u)" -eq 0 ]]; then
            bash "$SCRIPT" > "$RAW" 2>&1
            RC=$?
          elif sudo -n true >/dev/null 2>&1; then
            sudo -n bash "$SCRIPT" > "$RAW" 2>&1
            RC=$?
          else
            echo "BLOCKED_NONINTERACTIVE_ROOT" > "$RAW"
            RC=126
          fi
          set -e

          python3 - "$RAW" "$SAFE" <<'PY'
          import re, sys
          from pathlib import Path
          s = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          rules = [
              (r'(?i)(authorization:\s*bearer\s+)[^\s]+', r'\1[REDACTED]'),
              (r'\b(?:gh[opsu]_|github_pat_)[A-Za-z0-9_-]{10,}\b', '[REDACTED_GITHUB_TOKEN]'),
              (r'\bsk-[A-Za-z0-9_-]{10,}\b', '[REDACTED_API_KEY]'),
              (r'\b[0-9]{6,}:[A-Za-z0-9_-]{20,}\b', '[REDACTED_TELEGRAM_TOKEN]'),
              (r'(?i)\b([A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD|API_KEY|PRIVATE_KEY)[A-Z0-9_]*)\s*=\s*[^\s]+', r'\1=[REDACTED]'),
              (r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[EMAIL_REDACTED]'),
              (r'(?<!\d)(?:\+?966|0)?5\d{8}(?!\d)', '[PHONE_REDACTED]'),
          ]
          for pat, repl in rules:
              s = re.sub(pat, repl, s)
          Path(sys.argv[2]).write_text(s, encoding='utf-8')
          PY
          rm -f "$RAW" "$SCRIPT"
          cat "$SAFE"

          [[ "$RC" -eq 0 ]] || { echo "OPENCLAW_PR1150_ACCEPTANCE=FAIL rc=$RC"; exit "$RC"; }
          grep -Fq 'OPENCLAW_GATEWAY_AND_MEMORY=PASS' "$SAFE" || { echo "OPENCLAW_PR1150_ACCEPTANCE=FAIL missing-pass-token"; exit 41; }
          ! grep -qiE 'memory_provider_check=FAIL|ollama_embedding_probe=FAIL|OPENCLAW_GATEWAY_AND_MEMORY=DEGRADED' "$SAFE" || { echo "OPENCLAW_PR1150_ACCEPTANCE=FAIL contradictory-proof"; exit 42; }
          echo "OPENCLAW_PR1150_ACCEPTANCE=PASS"

      - name: Publish private redacted proof
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          SAFE="/tmp/pr1150-${GITHUB_RUN_ID}.log"
          COMMENT="/tmp/pr1150-${GITHUB_RUN_ID}.md"
          if [[ -f "$SAFE" ]] && grep -Fq 'OPENCLAW_GATEWAY_AND_MEMORY=PASS' "$SAFE"; then VERDICT=PASS; else VERDICT=FAIL_OR_BLOCKED; fi
          {
            echo "DEALIX_OPENCLAW_PR1150_ACCEPTANCE"
            echo
            echo "- verdict: ${VERDICT}"
            echo "- exact_head: ${EXPECTED_HEAD}"
            echo "- workflow_run_id: ${GITHUB_RUN_ID}"
            echo "- host_class: private self-hosted dealix-vps"
            echo
            echo '```text'
            if [[ -f "$SAFE" ]]; then tail -n 100 "$SAFE"; else echo "No safe log produced."; fi
            echo '```'
          } > "$COMMENT"
          gh api --method POST "repos/${REPO}/issues/${PROOF_ISSUE}/comments" -F "body=@${COMMENT}" >/dev/null
          rm -f "$COMMENT"

      - name: Upload redacted proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-pr1150-b689-${{ github.run_id }}
          path: /tmp/pr1150-${{ github.run_id }}.log
          if-no-files-found: warn
          retention-days: 7
