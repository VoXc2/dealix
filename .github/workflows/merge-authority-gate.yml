name: Merge Authority Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: merge-authority-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical verifier from main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Build immutable PR/comment snapshot
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const number = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const snapshot = {
              repo: `${context.repo.owner}/${context.repo.repo}`,
              number,
              head_sha: pr.head.sha,
              base_sha: pr.base.sha,
              draft: Boolean(pr.draft),
              state: pr.state,
              body: pr.body || '',
              now: new Date().toISOString(),
              comments: comments.map(c => ({
                user: { login: c.user?.login || '' },
                body: c.body || '',
                created_at: c.created_at,
              })),
            };
            fs.writeFileSync('merge-authority-snapshot.json', JSON.stringify(snapshot));

      - name: Verify exact action-bound merge authority
        env:
          DEALIX_MERGE_AUTHORITY_ACTORS: ${{ vars.DEALIX_MERGE_AUTHORITY_ACTORS || 'VoXc2' }}
        run: |
          python scripts/ops/verify_merge_authority_gate.py \
            --snapshot merge-authority-snapshot.json
