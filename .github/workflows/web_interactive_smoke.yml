# Browser smoke for the canonical Next.js front door under apps/web.
# Kept separate from the legacy static landing workflow so each surface is
# tested against the server that actually owns it. PR + manual only: post-merge
# production/front-door monitoring belongs to the canonical VPS/Railway plane.

name: Interactive Web smoke

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "tests/playwright/interactive_home.spec.js"
      - "tests/playwright/playwright.config.js"
      - "tests/playwright/package.json"
      - ".github/workflows/web_interactive_smoke.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: playwright-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interactive-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Next.js web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright + Chromium
        working-directory: tests/playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start canonical Next.js front door
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run dev > /tmp/dealix-interactive-web.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Next.js front door did not become ready within 60 seconds" >&2
          cat /tmp/dealix-interactive-web.log >&2 || true
          exit 1

      - name: Run interactive front-door smoke
        working-directory: tests/playwright
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
          CI: "true"
        run: |
          npx playwright test interactive_home.spec.js --config playwright.config.js

      - name: Stop Next.js server
        if: always()
        run: kill ${WEB_PID:-0} || true

      - name: Upload interactive-web diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interactive-web-smoke
          path: |
            tests/playwright/playwright-report/
            /tmp/dealix-interactive-web.log
          if-no-files-found: warn
          retention-days: 14
