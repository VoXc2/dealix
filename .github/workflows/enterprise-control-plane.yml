name: Enterprise Control Plane

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: enterprise-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify Enterprise Control Plane
        run: bash scripts/verify_enterprise_control_plane.sh
