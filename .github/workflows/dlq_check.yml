name: DLQ Size Check

# Manual GitHub diagnostic only.
# Continuous DLQ monitoring belongs to the canonical Dealix control plane
# (VPS scheduler), so hosted runner minutes are reserved for CI/release gates.
#
# Requires the following GitHub secrets when manually invoked:
#   STAGING_REDIS_URL       redis://:<pass>@host:6379/0
#   PRODUCTION_REDIS_URL    redis://:<pass>@host:6379/0
#
# Threshold: 5 items per queue (matches docs/ops/WEBHOOK_RETRY_DLQ.md SLO).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: DLQ — staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install redis
      - name: Check DLQ depth (staging)
        env:
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
        run: |
          python3 scripts/check_dlq_size.py --max 5 --json

  production:
    name: DLQ — production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install redis
      - name: Check DLQ depth (production)
        env:
          REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
        run: |
          python3 scripts/check_dlq_size.py --max 5 --json
