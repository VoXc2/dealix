name: Governed Full Ops Daily

# Canonical GitHub Company OS scheduler (issue #883).
# Runs a governed internal pulse every 4 hours, 24/7.
# This workflow is NOT external execution authority: no customer send, public
# publish, paid spend, payment/refund, contract/tender commitment, production
# mutation, DNS/DB/secrets mutation, voice activation, or proof/revenue
# promotion is authorized.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "morning | evening | commercial | full"
        default: "commercial"

concurrency:
  group: governed-full-ops-daily
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  governed-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Explicit fail-closed authority boundary. Downstream code must still
      # enforce its own canonical Approval/Controlled Execution gates.
      DEALIX_EXTERNAL_SEND: "0"
      DEALIX_EMAIL_LIVE_SEND: "0"
      DEALIX_WHATSAPP_OUTBOUND: "0"
      DEALIX_PUBLIC_PUBLISH: "0"
      DEALIX_PAID_SPEND: "0"
      DEALIX_LIVE_PAYMENT: "0"
      DEALIX_PAYMENT_EXECUTION: "0"
      DEALIX_PRODUCTION_MUTATION: "0"
      DEALIX_DNS_MUTATION: "0"
      DEALIX_DB_MUTATION: "0"
      DEALIX_SECRET_MUTATION: "0"
      DEALIX_IDENTITY_MUTATION: "0"
      DEALIX_AGENT_SELF_AUTHORITY: "0"
      DEALIX_AUTONOMY_LEVEL: "4"
      DEALIX_MODE: "draft-only"
      VOICE_AI_ENABLED: "false"
      VOICE_OUTBOUND_ENABLED: "false"
      VOICE_RECORDING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: python3 -m pip install pyyaml

      - name: Resolve governed pulse mode
        id: pulse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            # Six Saudi-day pulses (UTC+3). Keep scheduled execution bounded:
            # 03/07 KSA = morning intelligence; 11/15/19 KSA = commercial;
            # 23 KSA = evening reconciliation.
            HOUR="$(date -u +%H)"
            case "$HOUR" in
              00|04) MODE="morning" ;;
              08|12|16) MODE="commercial" ;;
              20) MODE="evening" ;;
              *) MODE="commercial" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "DEALIX_GOVERNED_PULSE_MODE=$MODE"

      - name: Run governed autopilot
        env:
          DEALIX_SYNC_EVIDENCE: ${{ secrets.DEALIX_SYNC_EVIDENCE || '0' }}
          DEALIX_API_BASE: ${{ secrets.DEALIX_API_BASE }}
          DEALIX_ADMIN_API_KEY: ${{ secrets.DEALIX_ADMIN_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          MODE="${{ steps.pulse.outputs.mode }}"
          if [ "$MODE" = "full" ]; then
            python3 scripts/run_dealix_complete_autonomous_day.py --weekly
          elif [ "$MODE" = "commercial" ]; then
            python3 scripts/run_dealix_complete_autonomous_day.py
          elif [ "$MODE" = "evening" ]; then
            python3 scripts/run_dealix_complete_autonomous_day.py --evening --skip-commercial-day
          else
            python3 scripts/run_dealix_complete_autonomous_day.py --skip-commercial-day
          fi

      - name: Run canonical Company OS L0-L4 cycle
        run: |
          set -euo pipefail
          python3 scripts/commercial/run_company_os_daily.py \
            --client dealix \
            --mode draft-only \
            --limit 100
          python3 scripts/commercial/run_autonomous_growth_daily.py \
            --autonomy-level 4 \
            --mode draft-only \
            --limit 100
          python3 scripts/commercial/run_self_improvement_daily.py \
            --client dealix \
            --mode draft-only

      - name: Build daily audit snapshot
        run: |
          set -euo pipefail
          python3 scripts/dealix_snapshot.py
          SNAPSHOT="docs/snapshots/$(date -u +%Y-%m-%d).json"
          test -s "$SNAPSHOT"

      - name: Verify fail-closed operating boundary
        run: |
          set -euo pipefail
          test "$DEALIX_EXTERNAL_SEND" = "0"
          test "$DEALIX_EMAIL_LIVE_SEND" = "0"
          test "$DEALIX_WHATSAPP_OUTBOUND" = "0"
          test "$DEALIX_PUBLIC_PUBLISH" = "0"
          test "$DEALIX_PAID_SPEND" = "0"
          test "$DEALIX_LIVE_PAYMENT" = "0"
          test "$DEALIX_PAYMENT_EXECUTION" = "0"
          test "$DEALIX_PRODUCTION_MUTATION" = "0"
          test "$DEALIX_DNS_MUTATION" = "0"
          test "$DEALIX_DB_MUTATION" = "0"
          test "$DEALIX_SECRET_MUTATION" = "0"
          test "$DEALIX_IDENTITY_MUTATION" = "0"
          test "$DEALIX_AGENT_SELF_AUTHORITY" = "0"
          test "$DEALIX_AUTONOMY_LEVEL" = "4"
          test "$DEALIX_MODE" = "draft-only"
          test "$VOICE_AI_ENABLED" = "false"
          test "$VOICE_OUTBOUND_ENABLED" = "false"
          test "$VOICE_RECORDING_ENABLED" = "false"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governed-full-ops-${{ github.run_id }}
          path: |
            data/founder_briefs/
            data/war_room_today.json
            docs/snapshots/*.json
            reports/self_operating_company_os/
          retention-days: 14
          if-no-files-found: ignore
