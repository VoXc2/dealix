name: SaaS Foundation

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'api/routers/auth.py'
      - 'api/routers/health.py'
      - 'api/routers/onboarding.py'
      - 'api/routers/platform_meta.py'
      - 'api/routers/customer/**'
      - 'api/routers/domains/customers/**'
      - 'api/security/**'
      - 'apps/web/app/**/dashboard/**'
      - 'apps/web/app/accept-invite/**'
      - 'apps/web/app/login/**'
      - 'apps/web/app/signup/**'
      - 'apps/web/lib/runtime-api.ts'
      - 'apps/web/next.config.js'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'core/config/deployment_identity.py'
      - 'core/email/**'
      - 'db/models.py'
      - 'db/models_subscription.py'
      - 'dealix/onboarding/**'
      - 'scripts/verify_saas_foundation.py'
      - 'tests/test_deployment_identity*.py'
      - 'tests/test_saas_*.py'
      - 'docs/ops/SAAS_ACTIVATION_RUNBOOK.md'
      - '.github/workflows/saas-foundation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/routers/auth.py'
      - 'api/routers/health.py'
      - 'api/routers/onboarding.py'
      - 'api/routers/platform_meta.py'
      - 'api/routers/customer/**'
      - 'api/routers/domains/customers/**'
      - 'api/security/**'
      - 'apps/web/app/**/dashboard/**'
      - 'apps/web/app/accept-invite/**'
      - 'apps/web/app/login/**'
      - 'apps/web/app/signup/**'
      - 'apps/web/lib/runtime-api.ts'
      - 'apps/web/next.config.js'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'core/config/deployment_identity.py'
      - 'core/email/**'
      - 'db/models.py'
      - 'db/models_subscription.py'
      - 'dealix/onboarding/**'
      - 'scripts/verify_saas_foundation.py'
      - 'tests/test_deployment_identity*.py'
      - 'tests/test_saas_*.py'
      - 'docs/ops/SAAS_ACTIVATION_RUNBOOK.md'
      - '.github/workflows/saas-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify SaaS backend foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install repository test environment
        run: python3 -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile changed Python surfaces
        run: |
          python3 -m py_compile \
            api/routers/health.py \
            api/routers/onboarding.py \
            api/routers/platform_meta.py \
            api/routers/customer/dashboard.py \
            api/routers/domains/customers/__init__.py \
            api/security/api_key.py \
            core/config/deployment_identity.py \
            core/email/__init__.py \
            core/email/invites.py \
            dealix/onboarding/service.py \
            scripts/verify_saas_foundation.py \
            tests/test_deployment_identity.py \
            tests/test_saas_onboarding_contract.py \
            tests/test_saas_foundation_verifier.py \
            tests/test_saas_web_journey_contract.py

      - name: Generate repository SaaS contract report
        id: foundation
        shell: bash
        run: |
          mkdir -p reports/saas
          set +e
          python3 scripts/verify_saas_foundation.py --json > reports/saas/foundation.json
          status=$?
          set -e
          cat reports/saas/foundation.json
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Upload SaaS foundation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: saas-foundation-diagnostics
          path: reports/saas/foundation.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce repository SaaS contracts
        shell: bash
        run: test "${{ steps.foundation.outputs.status }}" -eq 0

      - name: Run focused regressions with diagnostics
        id: focused
        shell: bash
        run: |
          mkdir -p reports/saas
          set +e
          python3 -m pytest -q --no-cov \
            tests/test_deployment_identity.py \
            tests/test_saas_onboarding_contract.py \
            tests/test_saas_foundation_verifier.py \
            tests/test_saas_web_journey_contract.py \
            2>&1 | tee reports/saas/focused-tests.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Upload SaaS focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: saas-focused-test-diagnostics
          path: reports/saas/focused-tests.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce focused regressions
        shell: bash
        run: test "${{ steps.focused.outputs.status }}" -eq 0

  web:
    name: Verify SaaS web journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_DEALIX_API_BASE: https://api.example.invalid
      NEXT_PUBLIC_API_URL: https://api.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
