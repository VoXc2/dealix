# Optional observability profile — disabled by default.
# This file NEVER auto-starts. It only takes effect with:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     --profile observability up
# No second stack, scheduler, or security control plane is created here:
# services reuse the existing app image/network and only add optional
# OTLP-compatible export endpoints. Do not deploy production telemetry
# from this file without explicit L5 authority.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: dealix-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/observability/otelcol.config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
    networks:
      - ai-company
    restart: "no"

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.14.0
    container_name: dealix-openobserve
    profiles: ["observability"]
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_USER_EMAIL:-admin@example.local}
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data
    networks:
      - ai-company
    restart: "no"

volumes:
  openobserve_data:

networks:
  ai-company:
    driver: bridge
