var dealixPosthogKey = window.DEALIX_POSTHOG_KEY || '';
if (dealixPosthogKey) {
  posthog.init(dealixPosthogKey, {
    api_host: window.DEALIX_POSTHOG_HOST || 'https://us.i.posthog.com',
    person_profiles: 'identified_only',
    autocapture: false,
    capture_pageview: true,
    capture_pageleave: true,
    disable_session_recording: true,
    loaded: function(client) {
      var params = new URLSearchParams(window.location.search);
      var campaign = {};
      ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(function(key) {
        var value = params.get(key);
        if (value) campaign[key] = value.substring(0, 160);
      });
      client.register_for_session(Object.assign({
        source_surface: 'dealix_public',
        locale: document.documentElement.lang || 'ar'
      }, campaign));

      document.querySelectorAll('a[href]').forEach(function(el) {
        var href = el.getAttribute('href') || '';
        var ctaId = el.getAttribute('data-cta-id');
        if (!ctaId && href.indexOf('diagnostic.html') === -1) return;
        el.addEventListener('click', function() {
          client.capture('cta_clicked', {
            cta_id: ctaId || 'diagnostic',
            page: window.location.pathname,
            destination: href.substring(0, 240)
          });
        });
      });
    }
  });
}
